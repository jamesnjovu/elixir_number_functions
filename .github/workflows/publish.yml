name: Publish

on:
  push:
    tags: ["v*"]
  # Docs are republishable for an already-released version, so a documentation
  # fix should not need a version bump. The package itself is immutable and this
  # path deliberately cannot touch it.
  workflow_dispatch:
    inputs:
      docs_only:
        description: "Republish docs for the current mix.exs version, without releasing"
        type: boolean
        default: true

permissions:
  # `write` so the release job can create a GitHub Release. The docs job below
  # does not need it, but permissions are declared per-workflow here.
  contents: write

jobs:
  docs:
    name: Republish docs only
    if: github.event_name == 'workflow_dispatch' && inputs.docs_only
    runs-on: ubuntu-latest
    environment: hex
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "26"

      - run: mix deps.get

      - name: Build docs
        run: mix docs

      - name: Publish docs
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish docs --yes

  publish:
    name: Publish to Hex
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    environment: hex
    steps:
      - uses: actions/checkout@v4

      - uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.18"
          otp-version: "27"

      - run: mix deps.get

      # Compile in its own step. Reading @version out of Mix.Project below must not
      # be the thing that triggers a first compile, or the version output gets mixed
      # in with compiler output and the comparison reads a garbage string.
      - run: mix compile

      # A tag that disagrees with @version publishes the wrong version to Hex and
      # cannot be undone — Hex releases are immutable. Refuse instead.
      - name: Tag must match mix.exs @version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(mix run --no-start -e 'IO.puts(Mix.Project.config()[:version])' | tail -n1)"
          echo "tag=$tag mix.exs=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag v$tag does not match mix.exs version $version"
            exit 1
          fi

      - name: Full test suite
        env:
          MIX_ENV: test
        run: mix test

      - name: Publish
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}
        run: mix hex.publish --yes

      # A tag with no GitHub Release leaves the repository's Releases page
      # advertising whatever was last released by hand — this repository sat on
      # v0.1.5 for a year that way. The notes are the matching CHANGELOG section,
      # so they cannot drift from what actually shipped.
      - name: Extract this version's changelog section
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "::error::no CHANGELOG section found for $version"
            exit 1
          fi
          echo "Release notes:"; head -20 release_notes.md

      - name: Create the GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_notes.md
          # Anything with a pre-release suffix should not become "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
